name: 'ops_sla_telemetry'
version: '0.1.0'
config-version: 2

profile: 'ops_sla_telemetry'

model-paths: ["models"]
macro-paths: ["macros"]
target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  ops_sla_telemetry:
    staging:
      +materialized: incremental
      +incremental_strategy: delete+insert
    intermediate:
      +materialized: incremental
      +incremental_strategy: delete+insert
    marts:
      +materialized: incremental
      +incremental_strategy: delete+insert
